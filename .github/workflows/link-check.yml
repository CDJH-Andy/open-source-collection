name: Link Check

on:
  schedule:
    # 每周一 00:00 UTC（北京时间 08:00）
    - cron: "0 0 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "**.md"
      - "scripts/check_links.py"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check markdown links
        id: link_check
        run: python scripts/check_links.py
        continue-on-error: true

      - name: Open issue when links are broken
        if: steps.link_check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `链接巡检发现死链（${new Date().toISOString().slice(0, 10)}）`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'link-check',
            });
            if (existing.data.some(i => i.title.includes('链接巡检'))) {
              console.log('已有未关闭的巡检 issue，跳过创建。');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['link-check'],
              body: '自动链接巡检发现无法访问的外链。请查看 Actions 运行日志，更新或移除失效链接后关闭本 issue。',
            });
